name: Compila APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: SDK API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      # Firma facoltativa: con i secret KEYSTORE_* l'APK è firmato con la tua chiave (e gli
      # aggiornamenti si installano sopra), senza viene firmato con una chiave di debug.
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
          else
            echo "Nessun secret KEYSTORE_BASE64: APK firmato con chiave di debug."
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p uscita
          cp app/build/outputs/apk/release/app-release.apk "uscita/FantaPanchina-open-${GITHUB_RUN_NUMBER}.apk"

      - name: Carica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: fantapanchina-open-apk
          path: uscita/*.apk
          if-no-files-found: error

      - name: Controlli lint
        run: gradle lintRelease --no-daemon

      - name: Carica il report lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Pulizia chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.p12"
